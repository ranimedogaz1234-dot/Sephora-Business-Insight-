name: Project verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - run: python scripts/check_public_repo.py
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip -r backend/requirements.txt
      - working-directory: backend
        run: python -c 'from main import health; assert health()["status"] == "ok"'
      - name: Backend tests (synthetic data only)
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest
      - working-directory: frontend
        run: |
          npm ci
          npm audit --package-lock-only
          npm run lint
          npm run typecheck
          npm test
          npm run build
